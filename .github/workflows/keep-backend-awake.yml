name: Keep Render OCR Backend Awake

on:
  schedule:
    # Request every 5 minutes so even if GitHub delays a tick, it hits within Render's 15-min window
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".github/workflows/keep-backend-awake.yml"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render OCR Backend Keep-Alive Endpoint
        env:
          BACKEND_PING_URL: ${{ secrets.BACKEND_PING_URL }}
        run: |
          TARGET_URL="${BACKEND_PING_URL:-https://cardflow-ocr.onrender.com/api/v1/ping}"
          echo "Pinging $TARGET_URL ..."
          curl --fail --silent --show-error --max-time 60 "$TARGET_URL"

